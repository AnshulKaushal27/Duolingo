<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="duoBodyCel" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#78d91c"/>
      <stop offset="85%" stop-color="#58cc02"/>
      <stop offset="100%" stop-color="#46a302"/>
    </radialGradient>
  </defs>

  <!-- Confetti sparkles in background -->
  <polygon points="12,18 16,14 14,22" fill="#ff4b4b"/>
  <polygon points="106,20 110,26 102,24" fill="#1cb0f6"/>
  <circle cx="24" cy="36" r="3.5" fill="#ffc800"/>
  <circle cx="98" cy="38" r="3.5" fill="#ce82ff"/>
  <rect x="88" y="14" width="5" height="5" transform="rotate(25 88 14)" fill="#ff9600"/>

  <!-- Party Hat -->
  <polygon points="60,2 48,32 72,32" fill="#ff4b4b"/>
  <polygon points="60,2 52,32 68,32" fill="#ffc800"/>
  <circle cx="60" cy="2" r="4.5" fill="#ffc800"/>
  <ellipse cx="60" cy="32" rx="13" ry="3.5" fill="#1cb0f6"/>

  <!-- Jumping Feet -->
  <ellipse cx="44" cy="112" rx="13" ry="6" fill="#ffb100"/>
  <ellipse cx="76" cy="112" rx="13" ry="6" fill="#ffb100"/>

  <!-- Body -->
  <ellipse cx="60" cy="68" rx="44" ry="43" fill="url(#duoBodyCel)"/>

  <!-- Arms raised high in celebration -->
  <path d="M 18 56 C 10 38, 12 24, 22 22 C 30 20, 30 40, 26 54 Z" fill="#58cc02"/>
  <path d="M 102 56 C 110 38, 108 24, 98 22 C 90 20, 90 40, 94 54 Z" fill="#58cc02"/>

  <!-- Belly -->
