  <path d="M 69 54 Q 78 63 87 54" stroke="#202020" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Cheerful Open Beak / Smile -->
  <ellipse cx="60" cy="66" rx="8" ry="7" fill="#e58700"/>
  <ellipse cx="60" cy="68" rx="6" ry="4" fill="#ff4b4b"/>
  <polygon points="53,63 67,63 60,70" fill="#ffb100"/>
</svg>
