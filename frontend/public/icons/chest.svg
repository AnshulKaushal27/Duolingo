<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="100%" height="100%">
  <defs>
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b87333"/>
      <stop offset="100%" stop-color="#80471c"/>
    </linearGradient>
    <linearGradient id="chestGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ffb700"/>
    </linearGradient>
  </defs>
  <!-- Chest bottom -->
  <rect x="4" y="16" width="28" height="15" rx="3" fill="#5c2e0b"/>
  <rect x="4" y="14" width="28" height="15" rx="3" fill="url(#chestWood)"/>
  <!-- Chest Lid -->
  <path d="M4 14 C4 8, 32 8, 32 14 Z" fill="url(#chestWood)"/>
  <!-- Gold Bands -->
  <rect x="8" y="10" width="4" height="19" fill="url(#chestGold)"/>
  <rect x="24" y="10" width="4" height="19" fill="url(#chestGold)"/>
  <!-- Lock -->
  <circle cx="18" cy="18" r="3.5" fill="url(#chestGold)"/>
  <circle cx="18" cy="18" r="1.5" fill="#5c2e0b"/>
</svg>
